
<!DOCTYPE html>
<html>
<head>
    <title>Student Login Portal</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <h1>KL UNIVERSITY </h1>
        <p>COLLEGE PORTAL LOGIN SYSTEM</p>
    </header>

    <div class="login-box">

        <h2>Student Login</h2>
        <p class="info">Login to access your student dashboard</p>

        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Student ID</label>
            <input type="text" placeholder="Enter your student ID" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>

            <label>Select Department</label>
            <select required>
                <option value="">Choose Department</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="register">
            New Student? <a href="#">Register Here</a>
        </p>

    </div>

    <footer>
        <p>&copy; 2026 ABC College of Engineering</p>
        <p>Student Portal | All Rights Reserved</p>
    </footer>

</body>
</html>
